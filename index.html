/**
 * sb(method, table, opts)
 * method : 'GET' | 'POST' | 'PATCH' | 'DELETE'
 * table  : 'profiles' | 'pieces' | 'records'
 * opts   :
 *   eq      → { column: value } 等值篩選（可多個）
 *   body    → 物件或陣列（POST/PATCH 的 payload）
 *   select  → 欄位字串，預設 '*'
 *   order   → 排序字串，如 'date.desc'
 *   single  → true = 只回傳第一筆（而非陣列）
 */
async function sb(method, table, opts = {}) {
  const { eq = {}, body, select = '*', order, single = false } = opts;

  const params = new URLSearchParams({ select });
  if (order) params.set('order', order);
  Object.entries(eq).forEach(([k, v]) => params.set(k, `eq.${v}`));

  const url = `${SUPABASE_URL}/rest/v1/${table}?${params}`;

  const headers = {
    apikey:        SUPABASE_ANON_KEY,
    Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
    'Content-Type': 'application/json',
  };
  // return=representation → POST/PATCH 回傳操作後的資料
  if (method === 'POST' || method === 'PATCH') {
    headers['Prefer'] = 'return=representation';
  }

  const res = await fetch(url, {
    method,
    headers,
    body: body != null ? JSON.stringify(body) : undefined,
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `Supabase ${res.status} ${table}`);
  }

  const text = await res.text();
  if (!text) return single ? null : [];
  const data = JSON.parse(text);
  return single ? (Array.isArray(data) ? data[0] || null : data) : data;
}



// ── 工具函式 ──────────────────────────────────────────────────
function td() { return new Date().toISOString().split('T')[0]; }
function newId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function wks(s, e) {
  if (!s) return 0;
  return Math.max(0, Math.floor((new Date(e || td()) - new Date(s)) / (7 * 86400 * 1000)));
}
// 只取 YYYY-MM-DD（Supabase date 欄位回傳已是正確格式，此為防護層）
function fmtDate(s) { return (s || '').slice(0, 10) || '—'; }
// 有效開始日期 = min(start_date, 所有記錄最早日期)
function effectiveStart(startDate, recs) {
  const base = fmtDate(startDate);
  if (!recs || !recs.length) return base;
  const earliest = recs.map(r => fmtDate(r.date)).filter(d => d && d !== '—').sort()[0];
  return earliest && earliest < base ? earliest : base;
}

function QuickBar() {
  function ins(v) {
    const el = document.getElementById(window._fid || '');
    if (!el) return;
    const s = el.selectionStart ?? el.value.length;
    const e = el.selectionEnd   ?? el.value.length;
    const nv = el.value.slice(0, s) + v + el.value.slice(e);
    const proto = el.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype;
    const setter = Object.getOwnPropertyDescriptor(proto, 'value');
    if (setter) setter.set.call(el, nv);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.setSelectionRange(s + v.length, s + v.length);
    el.focus();
  }
  return (
    <div style={{background:'#fff',borderTop:'2px dashed #D6EAFF',padding:'0.6rem 0.8rem',flexShrink:0}}>
      <div style={{fontSize:10,color:'#7EB3E8',marginBottom:'0.35rem'}}>✨ 快速插入 ── 先點練習內容欄，再點按鈕</div>
      <div style={{display:'flex',flexWrap:'wrap',gap:'0.3rem'}}>
        {QB.map(([l, v]) => (
          <button key={l} onMouseDown={e => { e.preventDefault(); ins(v); }}

                    color:'#2979C9',padding:'5px 10px',borderRadius:20,fontSize:12,cursor:'pointer',fontWeight:600}}>
            {l}
          </button>
        ))}
      </div>
    </div>
  );
}

  function pieceRecs(id) { return (records[id] || []).sort((a,b) => b.date.localeCompare(a.date)); }

  // ── 資料操作（全部改用 Supabase）─────────────────────────

  async function doSaveRecord(pieceId, recData) {
    setBusy(true);
    try {
      if (recData.record_id) {
        // 更新現有記錄
        await sb('PATCH', 'records', {
          eq: { record_id: recData.record_id },
          body: { date: recData.date, notes: recData.notes },

        const res = await sb('POST', 'records', {
          body: { record_id: newId(), piece_id: pieceId, date: recData.date, notes: recData.notes },

        recData.record_id = res?.[0]?.record_id || recData.record_id;

      setRecords(prev => {
        const list = (prev[pieceId] || []).filter(r => r.record_id !== recData.record_id);

      showToast('✓ 已儲存');

    setBusy(false);
  }

  async function doDeleteRecord(pieceId, record_id) {
    setBusy(true);
    try {
      await sb('DELETE', 'records', { eq:{ record_id } });
      setRecords(prev => ({ ...prev, [pieceId]: (prev[pieceId]||[]).filter(r=>r.record_id!==record_id) }));
      showToast('已刪除');
    } catch (err) { showToast(err.message, 'error'); }
    setBusy(false);
  }

  async function doPass(piece, passDate) {
    setBusy(true);
    try {
      await sb('PATCH', 'pieces', {
        eq: { piece_id: piece.piece_id },
        body: { status: 'hist', pass_date: passDate },
      });
      setPieces(prev => prev.map(p =>
        p.piece_id === piece.piece_id ? { ...p, status:'hist', pass_date: passDate } : p
      ));
      setPassTarget(null);
      go('home', { htab:'hist' });
      showToast('🏆 ' + piece.name + ' 過關！');
    } catch (err) { showToast(err.message, 'error'); }
    setBusy(false);
  }

  async function doSaveSingle() {
    if (!addFrom || !addNo.trim()) return;
    setBusy(true);
    try {
      const rec_id = newId();
      await sb('POST', 'records', {
        body: { record_id: rec_id, piece_id: addFrom, date: addDt||td(), notes: addNo.trim() },
      });
      const rec = { record_id: rec_id, piece_id: addFrom, date: addDt||td(), notes: addNo.trim() };
      setRecords(prev => ({
        ...prev,
        [addFrom]: [rec, ...(prev[addFrom]||[])].sort((a,b) => b.date.localeCompare(a.date)),
      }));
      showToast('✓ 已新增');
      go('detail', { sel: addFrom });
    } catch (err) { showToast(err.message, 'error'); }
    setBusy(false);
  }

  // ✅ 批次儲存：Supabase 原生支援陣列 POST（bulk insert）
  async function doSaveAll() {
    const valid = rows.filter(r => r.piece.trim());
    if (!valid.length) return;
    setBusy(true);
    try {
      const dt = multDt || td();
      const newRecords = [];

      for (const row of valid) {
        // 找現有曲目（記憶體中查找，不重複呼叫 API）
        let piece = D_cur.find(p => p.name.toLowerCase() === row.piece.trim().toLowerCase());
        let piece_id;

        if (!piece) {
          // 新曲目：POST 建立
          const pid2  = newId();
          const saved = await sb('POST', 'pieces', {
            body: { piece_id: pid2, profile_id: pid, name: row.piece.trim(), start_date: dt, status:'cur' },
          });
          piece_id = saved?.[0]?.piece_id || pid2;
          const newPiece = { piece_id, profile_id: pid, name: row.piece.trim(), start_date: dt, status:'cur', pass_date: null };
          setPieces(prev => [...prev, newPiece]);
        } else {
          piece_id = piece.piece_id;
        }

        newRecords.push({ record_id: newId(), piece_id, date: dt, notes: row.notes.trim() || '練習' });
      }

      // 一次批次 POST 所有記錄（Supabase 支援 array body = bulk insert）
      if (newRecords.length) {
        await sb('POST', 'records', { body: newRecords });
        newRecords.forEach(rec => {
          setRecords(prev => ({
            ...prev,
            [rec.piece_id]: [rec, ...(prev[rec.piece_id]||[])].sort((a,b) => b.date.localeCompare(a.date)),
          }));
        });
      }

      showToast('✓ 所有記錄已儲存');
      go('home');
    } catch (err) { showToast(err.message, 'error'); }
    setBusy(false);
  }

  async function doSaveProfile() {
    if (!epName.trim()) return;
    setBusy(true);
    try {
      if (editingProfile === 'new') {
        const pid2 = newId();
        const res  = await sb('POST', 'profiles', {
          body: { profile_id: pid2, name: epName.trim(), avatar: epAvatar, bg_color: epBg },
        });
        const newP = res?.[0] || { profile_id: pid2, name: epName.trim(), avatar: epAvatar, bg_color: epBg };
        setProfiles(prev => [...prev, newP]);
      } else {
        await sb('PATCH', 'profiles', {
          eq:   { profile_id: editingProfile.profile_id },
          body: { name: epName.trim(), avatar: epAvatar, bg_color: epBg },
        });
        setProfiles(prev => prev.map(p =>
          p.profile_id === editingProfile.profile_id
            ? { ...p, name: epName.trim(), avatar: epAvatar, bg_color: epBg } : p
        ));
      }
      setEditingProfile(null);
      showToast('✓ 帳號已儲存');
    } catch (err) { showToast(err.message, 'error'); }
    setBusy(false);
  }

  async function doDeleteProfile(profile_id) {
    if (!confirm('確定要刪除這個帳號及所有練習記錄？')) return;
    setBusy(true);
    try {
      // Supabase FK CASCADE 自動刪除關聯的 pieces 和 records
      await sb('DELETE', 'profiles', { eq:{ profile_id } });
      setProfiles(prev => prev.filter(p => p.profile_id !== profile_id));
      setEditingProfile(null);
      showToast('帳號已刪除');
    } catch (err) { showToast(err.message, 'error'); }
    setBusy(false);
  }

  // ══════════════════════════════════════════════════════════
  // DETAIL（練習中）
  // ══════════════════════════════════════════════════════════
  if (sc === 'detail') {

      </div>
      <div style={{padding:'0.7rem 1rem 1rem',flexShrink:0,display:'flex',flexDirection:'column',gap:'0.5rem'}}>
        <button onClick={()=>setPassTarget({...curPiece,effStart})}
          style={{background:'linear-gradient(135deg,#52C898,#0F6E56)',color:'#fff',border:'none',
                  padding:12,borderRadius:14,fontSize:14,cursor:'pointer',fontWeight:700,
                  boxShadow:'0 3px 10px rgba(15,110,86,0.35)'}}>🏆 過關</button>
        <button onClick={()=>go('add',{addFrom:curPiece.piece_id})}
          style={{background:'#EFF6FF',color:'#2979C9',border:'1.5px solid #A8D0F5',
                  padding:10,borderRadius:14,fontSize:13,cursor:'pointer',fontWeight:600}}>＋ 新增本曲練習記錄</button>
      </div>
    </>);
  }

  // ══════════════════════════════════════════════════════════
  // HISTDETAIL（已過關 · 唯讀）
  // ══════════════════════════════════════════════════════════
  if (sc === 'histdetail') {
    if (!histPiece) { go('home',{htab:'hist'}); return null; }
    const recs        = pieceRecs(histPiece.piece_id);
    const histEffStart = effectiveStart(histPiece.start_date, recs);
    const w           = wks(histEffStart, fmtDate(histPiece.pass_date));
    return shell(<>
      <Hdr title={'🏆 ' + histPiece.name} accent="#0F6E56"
           onBack={()=>hback==='detail'?go('detail'):go('home',{htab:'hist'})} badge="已過關" />
      <StatBar bg="#085041" cols={[
        {l:'開始練習', v:histEffStart, br:true},
        {l:'過關日期', v:fmtDate(histPiece.pass_date), lc:'#7FE0B8', br:true},
        {l:'共練習',   v:w+'週', br:true},
        {l:'次數',     v:recs.length+'次'},
      ]} />
      <div style={{flex:1,padding:'0.85rem',overflowY:'auto'}}>
        <div style={{background:'linear-gradient(135deg,#E1F5EE,#D4F5E7)',border:'1.5px solid #9FE1CB',
                     borderRadius:12,padding:'0.5rem 0.75rem',marginBottom:'0.7rem',
                     display:'flex',alignItems:'center',gap:'0.4rem'}}>
          <span style={{fontSize:14}}>🔒</span>
          <span style={{fontSize:11,color:'#0F6E56',fontWeight:600}}>已過關記錄為唯讀，無法修改</span>
        </div>
        <div style={{fontSize:11,color:'#52C898',fontWeight:700,marginBottom:'0.55rem'}}>練習記錄（{recs.length}次）</div>
        {recs.length===0 && <div style={{textAlign:'center',color:'#A8D0F5',padding:'2rem',fontSize:13}}>♬ 無記錄</div>}
        {recs.map(r => <ReadRecordCard key={r.record_id} rec={r} />)}
      </div>
    </>);
  }

  // ══════════════════════════════════════════════════════════
  // ADD
  // ══════════════════════════════════════════════════════════
  if (sc === 'add') {
    // 精簡模式：從本曲 detail 進入
    if (addFrom) {
      const piece = D_cur.find(p => p.piece_id === addFrom);
      if (!piece) { go('home'); return null; }
      return shell(<>
        <Hdr title={'🎵 ' + piece.name} sub="新增練習記錄" onBack={()=>go('detail',{sel:addFrom})} />
        <div style={{flex:1,overflowY:'auto',padding:'0.85rem'}}>
          <div style={{background:'#fff',borderRadius:18,padding:'1rem',
                       boxShadow:'0 2px 10px rgba(91,143,249,0.12)',border:'1.5px solid #E8F4FF',
                       display:'flex',flexDirection:'column',gap:'0.7rem'}}>
            <div>
              <div style={{fontSize:11,color:'#5B8FF9',fontWeight:700,marginBottom:4}}>📅 日期</div>
              <input type="date" value={addDt} onChange={e=>setAddDt(e.target.value)}
                style={{width:'100%',padding:'9px 10px',borderRadius:10,border:'1.5px solid #A8D0F5',
                        fontSize:13,background:'#f8fbff',color:'#1a2e4a'}} />
            </div>
            <div>
              <div style={{fontSize:11,color:'#5B8FF9',fontWeight:700,marginBottom:4}}>🎵 練習內容</div>
              <textarea id="add-single-no" rows={3} value={addNo} onChange={e=>setAddNo(e.target.value)}
                onFocus={()=>{window._fid='add-single-no';}} placeholder="例：♩=120 合手練習"
                style={{width:'100%',padding:'9px 10px',borderRadius:10,border:'1.5px solid #A8D0F5',
                        fontSize:13,background:'#fff',color:'#1a2e4a',resize:'none'}} />
            </div>
          </div>
        </div>
        <QuickBar />
        <div style={{padding:'0.6rem 0.85rem 0.9rem',flexShrink:0}}>
          <button onClick={doSaveSingle}
            style={{width:'100%',background:'linear-gradient(135deg,#5B8FF9,#2979C9)',color:'#fff',
                    border:'none',padding:12,borderRadius:14,fontSize:13,cursor:'pointer',fontWeight:700,
                    boxShadow:'0 3px 10px rgba(41,121,201,0.35)'}}>✓ 儲存記錄</button>
        </div>
      </>);
    }

    // 完整模式：從首頁進入
    function updateRow(i, field, val) {
      setRows(prev => { const nd=[...prev]; nd[i]={...nd[i],[field]:val}; return nd; });
    }
    return shell(<>
      <Hdr title="🎵 新增練習記錄" onBack={()=>go('home')} />
      <div style={{flex:1,overflowY:'auto',padding:'0.85rem',display:'flex',flexDirection:'column',gap:'0.7rem'}}>

        <div style={{background:'#fff',borderRadius:18,padding:'1rem',
                     boxShadow:'0 2px 10px rgba(91,143,249,0.1)',border:'1.5px solid #E8F4FF'}}>
          <div style={{fontSize:12,color:'#5B8FF9',fontWeight:700,marginBottom:'0.55rem'}}>✏️ 手動新增（可多筆）</div>
          <div style={{marginBottom:'0.6rem'}}>
            <div style={{fontSize:11,color:'#5B8FF9',fontWeight:600,marginBottom:4}}>📅 日期（所有筆共用）</div>
            <input type="date" value={multDt} onChange={e=>setMultDt(e.target.value)}
              style={{width:'100%',padding:'9px 10px',borderRadius:10,border:'1.5px solid #A8D0F5',
                      fontSize:13,background:'#f8fbff',color:'#1a2e4a'}} />
          </div>
          {rows.map((row, i) => (
            <div key={row.id} style={{background:'linear-gradient(135deg,#F7FBFF,#EFF6FF)',borderRadius:14,
                                      padding:'0.7rem',marginBottom:'0.5rem',border:'1.5px solid #D6EAFF'}}>
              <div style={{display:'flex',alignItems:'center',gap:'0.4rem',marginBottom:'0.4rem'}}>
                <div style={{width:22,height:22,borderRadius:'50%',
                             background:'linear-gradient(135deg,#5B8FF9,#2979C9)',
                             display:'flex',alignItems:'center',justifyContent:'center',
                             fontSize:11,color:'#fff',flexShrink:0,fontWeight:700}}>{i+1}</div>
                <input value={row.piece} onChange={e=>updateRow(i,'piece',e.target.value)}
                  id={'pc-'+row.id} placeholder="曲目名稱"
                  onFocus={()=>{window._fid='pc-'+row.id;}}
                  style={{flex:1,padding:'7px 9px',borderRadius:9,border:'1.5px solid #A8D0F5',
                          fontSize:13,background:'#fff',color:'#1a2e4a'}} />
                {rows.length>1 && (
                  <button onMouseDown={e=>e.preventDefault()} onClick={()=>setRows(prev=>prev.filter((_,j)=>j!==i))}
                    style={{background:'#FFEBEB',border:'1.5px solid #F5B8B8',color:'#C0392B',
                            width:26,height:26,borderRadius:'50%',fontSize:13,cursor:'pointer',
                            flexShrink:0,lineHeight:1,fontWeight:700}}>×</button>
                )}
              </div>
              <textarea value={row.notes} onChange={e=>updateRow(i,'notes',e.target.value)}
                id={'nt-'+row.id} rows={2} placeholder="練習內容（先點此欄，再用快速按鈕）"
                onFocus={()=>{window._fid='nt-'+row.id;}}
                style={{width:'100%',padding:'7px 9px',borderRadius:9,border:'1.5px solid #A8D0F5',
                        fontSize:13,background:'#fff',color:'#1a2e4a',resize:'none'}} />
            </div>
          ))}
          <button onClick={()=>setRows(prev=>[...prev,{id:Date.now(),piece:'',notes:''}])}
            style={{width:'100%',background:'#EFF6FF',border:'2px dashed #A8D0F5',
                    color:'#5B8FF9',padding:'8px',borderRadius:12,fontSize:12,cursor:'pointer',fontWeight:600}}>
            ＋ 加一筆曲目
          </button>
        </div>
      </div>
      <QuickBar />
      <div style={{padding:'0.6rem 0.85rem 0.9rem',flexShrink:0}}>
        <button onClick={doSaveAll}
          style={{width:'100%',background:'linear-gradient(135deg,#5B8FF9,#2979C9)',color:'#fff',
                  border:'none',padding:12,borderRadius:14,fontSize:13,cursor:'pointer',fontWeight:700,
                  boxShadow:'0 3px 10px rgba(41,121,201,0.35)'}}>✓ 儲存所有記錄</button>
      </div>
    </>);
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
