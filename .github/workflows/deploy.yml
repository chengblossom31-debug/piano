name: Deploy Piano Log to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FAMILY_EMAIL:      ${{ secrets.FAMILY_EMAIL }}
          FAMILY_PASSWORD:   ${{ secrets.FAMILY_PASSWORD }}
        run: |
          sed -i \
            -e "s|%%SUPABASE_URL%%|${SUPABASE_URL}|g" \
            -e "s|%%SUPABASE_ANON_KEY%%|${SUPABASE_ANON_KEY}|g" \
            -e "s|%%FAMILY_EMAIL%%|${FAMILY_EMAIL}|g" \
            -e "s|%%FAMILY_PASSWORD%%|${FAMILY_PASSWORD}|g" \
            index.html
          echo "✅ Secrets injected"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
